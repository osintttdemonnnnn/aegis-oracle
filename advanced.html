<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AEGIS ORACLE — Advanced Research</title><style>:root{color-scheme:dark}body{margin:0;background:#05070d;color:#d8e6ff;font-family:ui-monospace,monospace}main{max-width:1100px;margin:auto;padding:24px}h1{color:#67e8f9;margin:.2em 0}p{color:#8aa5c8}.card{border:1px solid #17324d;background:#0a1220;border-radius:12px;padding:16px}.row{display:flex;gap:8px;flex-wrap:wrap}input,select,button{background:#050b14;color:#d8e6ff;border:1px solid #1d4a6b;border-radius:8px;padding:10px;font:inherit}button{background:#0e7490;cursor:pointer}a{color:#67e8f9}.result{white-space:pre-wrap;overflow:auto;max-height:520px;border:1px solid #17324d;background:#030711;border-radius:10px;padding:12px;margin-top:14px}label{display:block;margin:10px 0}</style><main><h1>AEGIS ORACLE — Advanced Research</h1><p>Public-source research with provider attribution. Shared identifiers do not prove ownership. Email breach checks require authorization.</p><div class="card"><div class="row"><input id="q" placeholder="Domain, IP, ASN, CVE, keyword, organization, or authorized email"><select id="type"><option value="social">Social / web footprint</option><option value="records">Public-record gateways</option><option value="rdap">RDAP domain registration</option><option value="crt">Certificate transparency</option><option value="wayback">Wayback snapshots</option><option value="cve">CVE search</option><option value="kev">CISA KEV search</option><option value="breach">Email breach exposure</option></select><button onclick="run()">Run research</button></div><label><input type="checkbox" id="consent"> I own this email address or am authorized to assess it.</label><div id="out" class="result">Awaiting query.</div></div><p><a href="/">Return to DNS / IP / ASN research</a></p></main><script>async function run(){const q=document.getElementById('q').value.trim(),type=document.getElementById('type').value,consent=document.getElementById('consent').checked,out=document.getElementById('out');if(!q){out.textContent='Enter a query.';return}if(type==='breach'&&!consent){out.textContent='Affirm authorization before running an email breach-exposure check.';return}out.textContent='Querying '+type+'…';try{const u='/api/research?type='+encodeURIComponent(type)+'&q='+encodeURIComponent(q)+(type==='breach'?'&consent=true':'');const r=await fetch(u);const j=await r.json();out.textContent=JSON.stringify(j,null,2)}catch(e){out.textContent='Request failed: '+e.message}}</script></html>
